# Database operations against Supabase, run from CI.
#
# Manual dispatch only — nothing here ever fires on a push. Migrations that
# run automatically on merge are migrations that can half-apply to production
# while nobody is watching.
#
# GitHub → Actions → Database → Run workflow, then pick an action.
#
# Required repository secret:
#   SUPABASE_DB_URL       session pooler, port 5432 (migrations need session
#                         state and advisory locks that transaction pooling
#                         cannot hold)
#
# Optional repository secret:
#   SUPABASE_APP_DB_URL   the connection the deployed app uses — transaction
#                         pooler, port 6543. Only `doctor` uses it, because
#                         verifying row-level security over the migration
#                         connection proves nothing: that role owns the tables.
#
# Optional repository variables:
#   APP_URL               the deployment URL, so seeded invite links are
#                         clickable rather than pointing at localhost.
#   SEED_COMPANY_NAME     the real company name. Without it the seed resets
#                         the name to "Acme Corp" on every run.
#   SEED_COMPANY_SLUG     the upsert key for the company row. Only change this
#                         alongside the database, or the next seed creates a
#                         second company instead of updating the existing one.

name: Database

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        required: true
        default: doctor
        options:
          - doctor
          - migrate
          - migrate-and-seed
          - seed
          - remove-demo
          - rename-company
          - create-app-role
      seed_demo:
        description: Also insert the demo organisation (never for production)
        type: boolean
        required: false
        default: false
      from_slug:
        description: "rename-company only: the company's CURRENT slug"
        type: string
        required: false
        default: acme

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    # Prevents two dispatches racing each other onto the same database.
    concurrency:
      group: database-${{ github.repository }}
      cancel-in-progress: false

    env:
      # Deliberately NOT NODE_ENV=production: `npm ci` honours it by skipping
      # devDependencies, and this job runs entirely on them — tsx, prisma, the
      # scripts. It is a maintenance job, not a deployment.
      # Migrations and the seed both connect over the session pooler.
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      APP_URL: ${{ vars.APP_URL || 'http://localhost:3000' }}
      # The seed's upsert is `update: { name: SEED_COMPANY_NAME }`, keyed on
      # SEED_COMPANY_SLUG. Left unset these default to "Acme Corp"/"acme", so
      # every run would overwrite the real company name with the placeholder.
      # The slug is the upsert key: change it and the next seed creates a
      # SECOND company rather than updating this one.
      SEED_COMPANY_NAME: ${{ vars.SEED_COMPANY_NAME || 'Acme Corp' }}
      SEED_COMPANY_SLUG: ${{ vars.SEED_COMPANY_SLUG || 'acme' }}
      # The seed mints no sessions, so this only has to satisfy the env schema.
      AUTH_SECRET: ci-database-job-placeholder-not-used-for-sessions
      EMAIL_PROVIDER: console
      QUEUE_DRIVER: inline
      LOG_LEVEL: info
      # Off unless explicitly asked for. This job's usual target is production,
      # and the demo organisation is sample data that nobody wants to discover
      # sitting next to their real departments.
      SEED_DEMO: ${{ inputs.seed_demo }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --include=dev
      - run: npx prisma generate

      - name: Guard against a missing secret
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Apply migrations
        if: inputs.action == 'migrate' || inputs.action == 'migrate-and-seed'
        run: npx prisma migrate deploy

      - name: Create the application role
        if: inputs.action == 'create-app-role'
        run: |
          npm run db:role
          echo "::notice::Copy the DATABASE_URL above into Vercel, then re-run this workflow with 'doctor'."

      - name: Seed
        if: inputs.action == 'seed' || inputs.action == 'migrate-and-seed'
        run: |
          npm run db:seed
          echo "::notice::Invite links are in the log above. They are single-use and expire in 7 days."

      - name: Remove the demo organisation
        if: inputs.action == 'remove-demo'
        run: npm run db:remove-demo -- --apply

      - name: Rename the company
        if: inputs.action == 'rename-company'
        env:
          FROM_SLUG: ${{ inputs.from_slug }}
        run: |
          npm run db:rename-company -- --apply
          echo "::notice::Set the SEED_COMPANY_NAME and SEED_COMPANY_SLUG repository variables to match, or the next seed will not find this row."

      - name: Verify
        if: inputs.action != 'create-app-role'
        env:
          # Check the role the app actually connects as, when we know it.
          DATABASE_URL: ${{ secrets.SUPABASE_APP_DB_URL || secrets.SUPABASE_DB_URL }}
        run: npm run db:doctor
