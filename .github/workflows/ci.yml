# CI pipeline (docs/10-roadmap-testing-deployment.md §4).
#
# lint → typecheck → unit → integration (real Postgres, RLS active) → build.
# Nothing merges without the tenant-isolation and permission-matrix suites
# passing, because a regression there is a data breach, not a bug.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_test
      DIRECT_DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_test
      # Deliberately no REDIS_URL. With one set the queue hands jobs to BullMQ,
      # and nothing in CI consumes them — so the tests that check an email was
      # delivered would wait for a worker that does not exist. The suite has no
      # assertions about Redis; running without it exercises the inline driver,
      # which is what a serverless deployment uses anyway.
      AUTH_SECRET: ci-secret-value-long-enough-for-validation
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # `migrate deploy` rather than `db push`: this is also the rehearsal
      # that the hand-written RLS and constraint migrations still apply.
      - run: npx prisma migrate deploy

      # The suite must NOT run as the owner. FORCE ROW LEVEL SECURITY subjects
      # a table's owner to its policies but a superuser skips them entirely,
      # so a suite run as `hrms` would pass on the application layer alone and
      # prove nothing about the layer that exists for the day that one is
      # wrong. The harness refuses to run without this.
      - run: npm run db:role
        env:
          APP_DB_PASSWORD: ci-app-role-password

      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://app_user:ci-app-role-password@localhost:5432/hrms_test

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_e2e
      DIRECT_DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_e2e
      AUTH_SECRET: ci-secret-value-long-enough-for-validation
      APP_URL: http://localhost:3100
      EMAIL_PROVIDER: console
      LOG_LEVEL: silent
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # Accounts with known passwords. This is the only script that writes
      # one, and it refuses to run outside development and test.
      - run: npm run db:seed-e2e

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      AUTH_SECRET: build-secret-value-long-enough-for-validation
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the binary rather than the action: gitleaks-action requires a
      # paid licence for organisation repositories.
      - name: Scan for committed secrets
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      # Advisories in the build toolchain should not block a merge; anything
      # that ships to production should.
      - run: npm audit --omit=dev --audit-level=high
